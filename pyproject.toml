[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-atlas"
version = "0.1.0"
description = "Axiom Atlas backend services and shared graph-domain logic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3==1.39.14",
  "dramatiq[rabbitmq,redis]==1.18.0",
  "fastapi==0.115.0",
  "httpx==0.27.2",
  "neo4j==5.28.2",
  "networkx==3.3",
  "opensearch-py==2.7.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "psycopg[binary]==3.2.2",
  "python-dotenv==1.0.1",
  "redis==5.0.8",
  "sqlalchemy==2.0.35",
  "uvicorn[standard]==0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.6.9"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["packages/python/src", "apps/api/src", "apps/worker/src", "apps/ml-service/src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
